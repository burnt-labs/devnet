# HAProxy IBC chain additions
# Append to or include from main haproxy.cfg

# ─── Osmosis ────────────────────────────────

listen osmosis_rpc
    bind *:26757
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server osmosis osmosis:26657 check resolvers default

listen osmosis_api
    bind *:1417
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server osmosis osmosis:1317 check resolvers default

listen osmosis_grpc
    bind *:9190
    mode tcp
    server osmosis osmosis:9090 check resolvers default

# ─── Noble ──────────────────────────────────

listen noble_rpc
    bind *:26857
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server noble noble:26657 check resolvers default

listen noble_api
    bind *:1517
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server noble noble:1317 check resolvers default

listen noble_grpc
    bind *:9290
    mode tcp
    server noble noble:9090 check resolvers default
