global
    log stdout format raw daemon debug
    #stats socket /var/lib/haproxy/haproxy.sock level admin

defaults
    log global
    maxconn  1024
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend stats
    bind *:8444
    mode http
    stats enable
    stats uri /
    stats refresh 10s

listen rest
    bind *:1317
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    mode http
    server-template s 10 xion:1317 check init-addr last,none resolvers default

listen grpc
    bind *:9090
    mode tcp
    server-template s 10 xion:9090 check init-addr last,none resolvers default

listen rpc
    bind *:26657
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server-template s 10 xion:26657 check init-addr last,none resolvers default

listen client
    bind *:26658
    mode tcp
    server-template s 10 xion:26658 check init-addr last,none resolvers default

listen faucet
    bind *:3000
    mode http
    server xion-faucet xion-faucet:3000 check resolvers default

listen explorer
    bind *:5173
    mode http
    server xion-explorer xion-explorer:5173 check resolvers default

listen aa-api
    bind *:3001
    mode http
    server account-abstraction-api account-abstraction-api:3000 check resolvers default

listen indexer
    bind *:3002
    mode http
    server xion-indexer-graphql xion-indexer-graphql:3000 check resolvers default

listen dashboard
    bind *:3003
    mode http
    server xion-dashboard-app xion-dashboard-app:3000 check resolvers default

listen staking
    bind *:3004
    mode http
    server xion-staking xion-staking:3000 check resolvers default
