global
    log stdout format raw daemon debug

defaults
    log global
    maxconn  1024
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers default
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s

frontend stats
    bind *:8444
    mode http
    stats enable
    stats uri /
    stats refresh 10s

# ═══════════════════════════════════════════════════════════════════════════
# CORE — Xion Chain
# ═══════════════════════════════════════════════════════════════════════════

listen rest
    bind *:1317
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server-template s 10 xion:1317 check init-addr last,none resolvers default

listen grpc
    bind *:9090
    mode tcp
    server-template s 10 xion:9090 check init-addr last,none resolvers default

listen rpc
    bind *:26657
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    server-template s 10 xion:26657 check init-addr last,none resolvers default

listen client
    bind *:26658
    mode tcp
    server-template s 10 xion:26658 check init-addr last,none resolvers default

# ═══════════════════════════════════════════════════════════════════════════
# CORE — Faucet & Explorer
# ═══════════════════════════════════════════════════════════════════════════

listen faucet
    bind *:3000
    mode http
    server xion-faucet xion-faucet:3000 check resolvers default

listen explorer
    bind *:5173
    mode http
    server xion-explorer xion-explorer:5173 check resolvers default

