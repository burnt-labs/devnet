services:
  haproxy:
    image: haproxy:3.2-alpine
    command: >
      haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - xion
    networks:
      - default
    ports:
      - 1317:1317
      - 3000:3000
      - 3001:3001
      - 3002:3002
      - 3003:3003
      - 3004:3004
      - 5173:5173
      - 9090:9090
      - 26657:26657
      - 26658:26658
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  xion:
    image: ghcr.io/burnt-labs/xion/xion:${XIOND_VERSION:-latest}
    build:
      context: ./xion
      args:
        - VERSION=${XIOND_VERSION}
        - COMMIT=${COMMIT}
    command: >
      /usr/bin/cosmovisor run start \
        --api.address tcp://0.0.0.0:1317 \
        --api.enable true \
        --api.enabled-unsafe-cors true \
        --api.swagger true \
        --grpc.enable true \
        --grpc.address 0.0.0.0:9090 \
        --grpc-web.enable \
        --minimum-gas-prices 0.001uxion \
        --rpc.laddr tcp://0.0.0.0:26657 
    entrypoint: /home/xiond/init/entrypoint.sh
    deploy:
      replicas: ${NUM_VALIDATORS:-3}
    env_file:
      - .env
    ports:
      - 1317
      - 9090
      - 26656
      - 26657
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:26657/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    user: root
    working_dir: /home/${DAEMON_NAME}
    networks:
      - default
    volumes:
      - /home/${DAEMON_NAME}
      - shared:/home/${DAEMON_NAME}/.shared
      - ./scripts/init:/home/${DAEMON_NAME}/init

  xion-explorer:
    build:
      context: xion-explorer/
      args:
        VITE_DEPLOYMENT_ENV: devnet
    image: ghcr.io/burnt-labs/xion/xion-explorer:latest
    ports:
      - "5173"
    networks:
      - default

  xion-faucet:
    build:
      context: xion-faucet/
      args:
        DOTENV_FILE: .env.example
    image: ghcr.io/burnt-labs/xion/xion-faucet:latest
    env_file:
      - ./xion-faucet/.env.example
    ports:
      - "3000"
    networks:
      - default

  # === Core Apps (Phase 2) ===

  account-abstraction-api:
    build:
      context: account-abstraction-api/
    image: ghcr.io/burnt-labs/xion/account-abstraction-api:latest
    environment:
      - XION_RPC_URL=http://haproxy:26657
      - XION_API_URL=http://haproxy:1317
      - XION_GRPC_URL=haproxy:9090
      - CHAIN_ID=xion-devnet-1
    ports:
      - "3000"
    depends_on:
      xion:
        condition: service_healthy
    networks:
      - default

  xion-indexer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - indexer-db:/var/lib/postgresql/data
    networks:
      - default

  xion-indexer-node:
    image: subquerynetwork/subql-node-cosmos:v3.11.2
    depends_on:
      xion-indexer-db:
        condition: service_healthy
      xion:
        condition: service_healthy
    restart: always
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: xion-indexer-db
      DB_PORT: 5432
    volumes:
      - ./xion-indexer:/app
    command:
      - ${SUB_COMMAND:-forceClean}
      - -f=/app
      - --db-schema=app
      - --unsafe
    healthcheck:
      test: ["CMD", "curl", "-f", "http://xion-indexer-node:3000/ready"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - default

  xion-indexer-graphql:
    image: subquerynetwork/subql-query:latest
    depends_on:
      xion-indexer-db:
        condition: service_healthy
      xion-indexer-node:
        condition: service_healthy
    restart: always
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: xion-indexer-db
      DB_PORT: 5432
    command:
      - --name=app
      - --playground
      - --indexer=http://xion-indexer-node:3000
    ports:
      - "3002"
    networks:
      - default

  xion-dashboard-app:
    build:
      context: xion-dashboard-app/
      args:
        NETWORK_NAME: devnet
    image: ghcr.io/burnt-labs/xion/xion-dashboard-app:latest
    environment:
      - VITE_NETWORK=devnet
      - VITE_CHAIN_ID=xion-devnet-1
      - VITE_XION_API_URL=http://haproxy:1317
      - VITE_XION_RPC_URL=http://haproxy:26657
      - VITE_ABSTRAXION_API_URL=http://account-abstraction-api:3001
      - VITE_STYTCH_PUBLIC_TOKEN=${STYTCH_PUBLIC_TOKEN:-public-token-test-placeholder}
      - VITE_NUMIA_TOKEN=${NUMIA_TOKEN:-placeholder}
      - VITE_DEFAULT_INDEXER_URL=http://xion-indexer-graphql:3000
      - VITE_FEE_GRANTER_ADDRESS=${FEE_GRANTER_ADDRESS:-}
      - VITE_DEFAULT_ACCOUNT_CONTRACT_CODE_ID=1
    ports:
      - "3003"
    depends_on:
      - account-abstraction-api
    networks:
      - default

  xion-staking:
    build:
      context: xion-staking/
    image: ghcr.io/burnt-labs/xion/xion-staking:latest
    environment:
      - NEXT_PUBLIC_CHAIN_ID=xion-devnet-1
    ports:
      - "3004"
    depends_on:
      xion:
        condition: service_healthy
    networks:
      - default

networks:
  default:

volumes:
  shared:
  indexer-db:
